<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valheim Build Planner</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <div id="app">
    <header id="toolbar"></header>
    <div id="context-bar"></div>
    <main id="main">
      <div id="stage">
        <canvas id="canvas"></canvas>
        <div id="empty-state" hidden>
          <div class="empty-card">
            <div class="empty-title">Start a plan</div>
            <p>Import a world save to load the pieces around your anchor sign, or pick an asset and start placing.</p>
            <div class="row-buttons">
              <button id="empty-import" class="chip accent" data-icon="globe">Import world save</button>
              <button id="empty-screenshot" class="chip" data-icon="image-plus">Add screenshot</button>
              <button id="empty-open" class="chip" data-icon="folder-open">Open plan</button>
            </div>
          </div>
        </div>
        <div id="inspector" hidden></div>
        <div id="toast"></div>
      </div>
      <aside id="sidebar">
        <nav class="tabs">
          <button class="tab active" data-tab="assets">Assets</button>
          <button class="tab" data-tab="layers">Layers</button>
          <button class="tab" data-tab="settings">Settings</button>
        </nav>
        <section id="tab-assets" class="tab-panel"></section>
        <section id="tab-layers" class="tab-panel" hidden></section>
        <section id="tab-settings" class="tab-panel" hidden></section>
      </aside>
    </main>
    <footer id="statusbar"></footer>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
