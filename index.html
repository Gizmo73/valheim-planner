<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Valheim Build Planner</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="toolbar"></div>

    <div id="content">
      <div id="canvas-container">
        <canvas id="main-canvas"></canvas>
        <div id="empty-state">
          <h2>Valheim Build Planner</h2>
          <p>Upload a map image to begin</p>
        </div>
        <div id="mobile-controls" class="hidden"></div>
      </div>

      <div id="sidebar">
        <div id="layer-panel">
          <div class="panel-header">Layers</div>
          <div id="layer-list"></div>
        </div>

        <div id="asset-panel">
          <div class="panel-header">Assets</div>
          <div id="asset-list"></div>
        </div>
      </div>
      <div id="sidebar-backdrop" class="hidden"></div>
    </div>

    <div id="help-panel">
      <div class="help-shortcuts">
        <span><kbd>Space</kbd> + drag to pan</span>
        <span><kbd>Scroll</kbd> to zoom</span>
        <span><kbd>Q</kbd><kbd>E</kbd> rotate</span>
        <span><kbd>D</kbd> duplicate</span>
        <span><kbd>Del</kbd> delete</span>
        <span><kbd>Shift</kbd>+click multi-select</span>
        <span><kbd>G</kbd> group selected</span>
        <span><kbd>F</kbd> flash fill</span>
        <span><kbd>Ctrl</kbd>+<kbd>A</kbd> select all</span>
        <span><kbd>Ctrl</kbd> asset snap</span>
        <span><kbd>Shift</kbd> free place</span>
      </div>
      <button id="help-close">✕</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
