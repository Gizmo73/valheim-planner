      <rect width="5.2" height="5.2" fill="none" stroke="rgba(255,255,255,.12)" stroke-width=".3"/>
    </pattern>
  </defs>

  <rect width="64" height="64" fill="#2563a8"/>
  <rect x="6" y="6" width="52" height="52" fill="url(#g)"/>

  <!-- V — left arm with serif top -->
